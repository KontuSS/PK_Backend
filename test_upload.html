<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Upload Test</title>
  </head>
  <body>
    <h1>Simple File Upload Test</h1>

    <div>
      <h2>Login First</h2>
      <input
        type="email"
        id="email"
        placeholder="Email"
        value="user@example.com"
      />
      <input
        type="password"
        id="password"
        placeholder="Password"
        value="password"
      />
      <button onclick="login()">Login</button>
      <div id="token-display"></div>
    </div>

    <hr />

    <div>
      <h2>Upload File</h2>
      <input type="file" id="fileInput" accept=".py,.js,.ts,.java,.cpp,.c" />
      <button onclick="uploadFile()">Upload File</button>
    </div>

    <div>
      <h2>My File Operations</h2>
      <button onclick="getMyFile()">Get My File Info</button>
      <button onclick="viewMyFile()">View My File</button>
      <button onclick="downloadMyFile()">Download My File</button>
      <button onclick="deleteMyFile()">Delete My File</button>
    </div>

    <div>
      <h2>Browse Users</h2>
      <button onclick="getAllUsers()">Get All Users with Files</button>
    </div>

    <div
      id="output"
      style="margin-top: 20px; padding: 10px; background: #f5f5f5"
    ></div>

    <script>
      let authToken = "";
      const API_BASE = "http://localhost:3000";

      function log(message) {
        document.getElementById("output").innerHTML +=
          "<p>" + JSON.stringify(message, null, 2) + "</p>";
      }

      async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
          const response = await fetch(`${API_BASE}/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const data = await response.json();
          if (data.token) {
            authToken = data.token;
            document.getElementById(
              "token-display"
            ).innerHTML = `<p>Token: ${authToken.substring(0, 20)}...</p>`;
            log("Login successful");
          } else {
            log("Login failed: " + data.error);
          }
        } catch (error) {
          log("Login error: " + error.message);
        }
      }

      async function uploadFile() {
        const fileInput = document.getElementById("fileInput");
        if (!fileInput.files[0]) {
          log("Please select a file");
          return;
        }

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        try {
          const response = await fetch(`${API_BASE}/files/upload`, {
            method: "POST",
            headers: { Authorization: `Bearer ${authToken}` },
            body: formData,
          });

          const data = await response.json();
          log("Upload response: " + data);
        } catch (error) {
          log("Upload error: " + error.message);
        }
      }

      async function getMyFile() {
        try {
          const response = await fetch(`${API_BASE}/files/my-file`, {
            headers: { Authorization: `Bearer ${authToken}` },
          });
          const data = await response.json();
          log("My file info: " + data);
        } catch (error) {
          log("Get file error: " + error.message);
        }
      }

      async function viewMyFile() {
        try {
          const response = await fetch(`${API_BASE}/files/my-file/view`, {
            headers: { Authorization: `Bearer ${authToken}` },
          });
          const text = await response.text();
          log("File content: " + text);
        } catch (error) {
          log("View file error: " + error.message);
        }
      }

      async function downloadMyFile() {
        try {
          const response = await fetch(`${API_BASE}/files/my-file/download`, {
            headers: { Authorization: `Bearer ${authToken}` },
          });
          const blob = await response.blob();

          // Create download link
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.style.display = "none";
          a.href = url;
          a.download = "downloaded_file";
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(url);

          log("File downloaded");
        } catch (error) {
          log("Download error: " + error.message);
        }
      }

      async function deleteMyFile() {
        try {
          const response = await fetch(`${API_BASE}/files/my-file`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${authToken}` },
          });
          const data = await response.json();
          log("Delete response: " + data);
        } catch (error) {
          log("Delete error: " + error.message);
        }
      }

      async function getAllUsers() {
        try {
          const response = await fetch(`${API_BASE}/files/users`, {
            headers: { Authorization: `Bearer ${authToken}` },
          });
          const data = await response.json();
          log("All users with files: " + data);
        } catch (error) {
          log("Get users error: " + error.message);
        }
      }
    </script>
  </body>
</html>
