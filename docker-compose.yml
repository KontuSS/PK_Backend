version: "3.9"

services:
  db:
    image: postgres:16-alpine      # Postgres 16 + vector
    container_name: database
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./AppDB.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./Dummy_Data_AppDB.sql:/docker-entrypoint-initdb.d/02-data.sql

volumes:
  pgdata:
